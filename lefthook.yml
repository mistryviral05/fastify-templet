# Lefthook git hooks
# Docs: https://lefthook.dev

# Skip hooks during merge and rebase, those are not your commits
skip:
    - merge
    - rebase

pre-commit:
    parallel: false
    jobs:
        - name: format
          glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc}"
          run: bunx oxfmt {staged_files}
          stage_fixed: true

        - name: lint
          glob: "*.{ts,tsx,js,mjs,cjs}"
          run: bunx oxlint --fix {staged_files}
          stage_fixed: true

commit-msg:
    jobs:
        - name: commitlint
          run: bunx commitlint --edit {1}

pre-push:
    parallel: true
    jobs:
        - name: typecheck
          run: bun run typecheck

        - name: lint
          run: bun run lint

        - name: build
          run: bun run build

